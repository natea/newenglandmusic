# dependabot: security fixes only, no routine version bumps.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# open-pull-requests-limit: 0 turns off version-update PRs. security-update PRs
# don't count against it: they open when an advisory affects a pinned package
# (repo settings > code security > dependabot security updates must be on),
# grouped into one PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    # moving to django 5.2 is its own change, so don't propose it as a security fix.
    # security updates honour these ignore rules too.
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
