name: Spek pages

# Publishes the OpenSpec specs and changes as Spek pages on this repo's GitHub
# Pages (docs/SPEK.md). Change branches publish on push; main's page at the
# site root is rebuilt daily and on demand, never on a push to main, so no
# Spek check sits on main's commits and Render's deploy never waits for one.
on:
  push:
    branches: ["change/*"]
    paths: ["openspec/**", ".github/workflows/spek.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# one publish at a time, none dropped
concurrency:
  group: spek-pages
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'natea/newenglandmusic'
    runs-on: ubuntu-24.04
    steps:
      # every step may fail without failing the job, so a commit's checks stay green
      - name: Check out the repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the changes' dates

      - name: Build the Spek page
        id: build
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: spekhq/spek@5542fa2dfda6c52a08fb0610a140670052056c66 # v1.20.2
        with:
          spek-version: 5542fa2dfda6c52a08fb0610a140670052056c66 # v1.20.2
          title: "New England Music Project - OpenSpec"
          output-path: ${{ runner.temp }}/spek/spek.html

      - name: Publish to gh-pages
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
          PAGE: ${{ runner.temp }}/spek/spek.html
          SITE: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            # no gh-pages yet: start it, and require it still be absent when pushing
            git init --quiet --initial-branch=gh-pages -- "$SITE"
            git -C "$SITE" remote add origin "$(git remote get-url origin)"
            git -C "$SITE" config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
            lease="gh-pages:"
          elif [ "$rc" -eq 0 ]; then
            git fetch --quiet --depth=1 origin gh-pages
            fetched="$(git rev-parse FETCH_HEAD)"
            git worktree add --quiet --detach -- "$SITE" "$fetched"
            git -C "$SITE" checkout --quiet -B gh-pages
            lease="gh-pages:$fetched"
          else
            echo "couldn't read gh-pages (git ls-remote exited $rc); publishing nothing" >&2
            exit 1
          fi
          python3 bin/publish-spek-page "$BRANCH" "$PAGE" "$SITE"
          git -C "$SITE" add --all
          if git -C "$SITE" rev-parse --verify --quiet HEAD >/dev/null; then
            git -C "$SITE" commit --quiet --amend -m "Spek pages"
          else
            git -C "$SITE" commit --quiet -m "Spek pages"
          fi
          git -C "$SITE" push --quiet --force-with-lease="$lease" origin HEAD:refs/heads/gh-pages
