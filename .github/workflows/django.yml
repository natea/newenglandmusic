name: Django CI

# render deploys main only after this passes (autoDeployTrigger: checksPass)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # pinned, so a new ubuntu-latest image (and its python builds) never blocks a deploy
    runs-on: ubuntu-24.04
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost # default host value for the database
      POSTGRES_DB: djtesting
      POSTGRES_PORT: 5432
    services:
      postgres_main:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # same as PYTHON_VERSION in render.yaml
          python-version: "3.11.14"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # the browser for the play-button test (core/tests/test_artist_preview_browser.py)
          python -m playwright install --with-deps chromium
      - name: Run Tests
        run: |
          # the compiled css is git-ignored, and the browser tests check sizes it sets
          # (the youtube player's 200px minimum)
          python manage.py compilescss
          python manage.py test
        env:
          DATABASE_URL: "postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}"
          DJANGO_SECRET_KEY: "F5ADD2EE-40F5-4F4E-911C-4714E7CA873F"
          ALLOWED_HOSTS: "localhost"
          DJANGO_SETTINGS_MODULE: "nycnoise.settings.test"
          RC_DEVELOPER_INTERNAL_TOKEN: "0xdeadbeef"
          PROD_INTERNAL_API_SERVER: "https://nyc-noise.com"
          DEBUG_TOOLBAR_ENABLE: "false"
          PYINSTRUMENT_ENABLE: "false"
          ENABLE_EMAILING_JESSICA_ON_EVENT_SUBMISSION: "false"
