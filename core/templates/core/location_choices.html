{% extends 'core/base.html' %}

{% block content %}
  <div id='maincontent' class='static_page'>
    <h1>Which {{ q }}?</h1>
    <ul>
      {% for choice in choices %}
        <li><a href="/location?q={{ choice.label|urlencode }}&amp;next={{ next|urlencode }}">{{ choice.label }}</a></li>
      {% endfor %}
    </ul>
    <p><a href="{{ next }}">Back</a></p>
  </div>
{% endblock %}
