{% load static %}

<script src="{% static 'core/lib/maplibre-gl.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'core/lib/maplibre-gl.min.css' %}">

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function() {
    // two kinds of map: a day's (a "SHOW MAP" link with data-date, on the listing) and a
    // map of every event on the page (data-map="all", on the saved shows page)
    const dateLinks = document.querySelectorAll('a[data-date], a[data-map="all"]')
    // each map, its pins and its pin-click handler, by key ("all" or a day's mmddyy): the
    // map only adds its pins once its style has loaded, so the tests read them here
    window.siteMaps = window.siteMaps || {};
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    // "110626" (mmddyy) -> "Nov 6"
    const shortDate = mmddyy => `${MONTHS[parseInt(mmddyy.slice(0, 2), 10) - 1]} ${parseInt(mmddyy.slice(2, 4), 10)}`;
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    // "110626" (mmddyy) -> "Fri"
    const weekday = mmddyy => DAYS[new Date(
      2000 + parseInt(mmddyy.slice(4, 6), 10), parseInt(mmddyy.slice(0, 2), 10) - 1, parseInt(mmddyy.slice(2, 4), 10)
    ).getDay()];
    // the page's own events, not the copies a map's info panel shows
    const notACopy = eventDiv => !eventDiv.closest('[id^="map-"][id$="-info"]');

    // whether two venues are next door to each other, within about 50 meters: they share a
    // pin, as their pins would otherwise sit on top of each other (the 9:30 Club and The
    // Atlantis, 28m apart, hid each other's shows)
    const areNextDoor = (lnglatA, lnglatB) => {
      // convert each string to an 2D array of numbers
      const pointsA = lnglatA.split(',').map(d => parseFloat(d));
      const pointsB = lnglatB.split(',').map(d => parseFloat(d));

      const distance = Math.sqrt((pointsA[0]-pointsB[0]) ** 2 + (pointsA[1]-pointsB[1]) ** 2);
      return distance < 0.0005;
    }

    // do some preprocessing to figure out venues next door to each other
    // first, create a dictionary of all of our venues and their lnglats
    const lnglatsByVenueId = {}
    const allEventDivs = document.querySelectorAll(`div.event[data-venue-lnglat]`)
    Array.from(allEventDivs).filter((obj, index, arr) =>  // filter to unique venue ids
        index === arr.findIndex(obj2 => obj.getAttribute('data-venue-id') === obj2.getAttribute('data-venue-id'))
      ).forEach(eventDiv => {
        const venueId = eventDiv.getAttribute('data-venue-id');
        lnglatsByVenueId[venueId] = eventDiv.getAttribute('data-venue-lnglat');
      });
    // an array where each element is an array of venue IDs next door to each other
    const mergedVenues = [];
    Object.entries(lnglatsByVenueId).forEach(([venueId, venueLngLat]) => {
      let foundMatchingVenue = false;
      mergedVenues.forEach((venueList, index) => {
        if (areNextDoor(venueLngLat, lnglatsByVenueId[venueList[0]])) {
          mergedVenues[index].push(venueId);
          foundMatchingVenue = true;
        }
      });

      if (!foundMatchingVenue) {
        mergedVenues.push([venueId]);
      }
    });
    // convert this array or arrays to an array of strings
    // these will become our venueIds for the map & eventsByVenueId object
    const mergedVenueIds = mergedVenues.map(el => el.join(','));

    dateLinks.forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        
        // a day's map, or (scope "all") one of every event on the page
        const scope = link.getAttribute('data-map') === 'all' ? 'all' : null;
        const date = scope || link.getAttribute('data-date');
        const mapDiv = document.querySelector(`#map-${date}`);
        const mapIsShown = mapDiv.style.display === 'block';
        mapDiv.style.display = mapIsShown ? 'none' : 'block';
        document.getElementById(`map-${date}-info`).style.display = mapIsShown ? 'none' : 'block';
        link.textContent = mapIsShown ? 'SHOW MAP' : 'HIDE MAP';

        if(mapIsShown) {
          return;
        }
        // if map already exists, don't recreate it
        if (mapDiv.children.length > 0) {
          return;
        }

        // find all of the <div> with class="event"
        // that have a data-date of the same value,
        // and have a data-venue-latlng
        const eventDivs = Array.from(document.querySelectorAll(
          scope ? 'div.event[data-venue-lnglat]' : `div.event[data-date="${date}"][data-venue-lnglat]`
        )).filter(notACopy);

        const eventsByVenueId = {};
        Array.from(eventDivs).forEach(eventDiv => {
          const isCancelled = eventDiv.getAttribute('data-is-cancelled') === 'True';
          if (isCancelled) {
            return;
          }
          const lnglat = eventDiv.getAttribute('data-venue-lnglat').split(',');
          // a map of several days labels each show with its date too: "Nov 6 7:00pm"
          const startTime = scope
            ? `${shortDate(eventDiv.getAttribute('data-date'))} ${eventDiv.getAttribute('data-starttime')}`
            : eventDiv.getAttribute('data-starttime');
          const titleAndArtists = eventDiv.getAttribute('data-title-and-artists');
          let subString = titleAndArtists.split(' ').slice(0, 5).join(' ');
          if (titleAndArtists.length > subString.length) {
            subString += '...';
          }
          const venueId = eventDiv.getAttribute('data-venue-id');
          const mergedVenueId = mergedVenueIds.find(string => string.includes(venueId))

          eventsByVenueId[mergedVenueId] = eventsByVenueId[mergedVenueId] || [];
          eventsByVenueId[mergedVenueId].push({
            'type': 'Feature',
            'id': Math.floor(Math.random() * 0xffffffff),
            'properties': {
              'divId': eventDiv.id,
              'venueIds': mergedVenueId,
              'startTime': startTime,
              'description': subString
            },
            'geometry': {
              'type': 'Point',
              'coordinates': [parseFloat(lnglat[0]), parseFloat(lnglat[1])]
            }
          });
        });
        const features = Object.values(eventsByVenueId).map(events => {
          // if multiple events at the same venue, only return the first one but
          // merge all of the description strings with the '\n' separator
          const description = events.map(event => event.properties.description).join('\n');
          const eventTimes = events.map(event => event.properties.startTime).join(', ');
          const event = events[0];
          // a map of several days labels each show on a line of its own, its date and time
          // with its name, so a shared pin doesn't separate when from what
          const label = events.map(event => `${event.properties.startTime} ${event.properties.description}`).join('\n');
          event.properties.startTime = eventTimes;
          event.properties.description = description;
          event.properties.label = label;
          return event;
        });
        const allFeatures = {
          'type': 'FeatureCollection',
          'features': features
        };

        const map = new window.maplibregl.Map({
          container: `map-${date}`,
          // MAP_CENTER_* and MAP_ZOOM in .env; the map then fits itself to the day's venues
          zoom: {{ map_zoom }},
          center: {{ map_center }},
          style: "https://api.protomaps.com/styles/v4/light/en.json?key={{ protomaps_api_key|urlencode }}",
          maxPitch: 0,
        });
        // fit bounds of all points. a day without located shows has none, and fitting empty
        // bounds throws, which stopped the rest of the map's setup
        if (features.length) {
          const bounds = new maplibregl.LngLatBounds();
          features.forEach(feature => {
            bounds.extend(feature.geometry.coordinates);
          });
          map.fitBounds(bounds, {
            padding: {top: 25, bottom: 10}, // more room at top for marker height
            animate: false,
          });
          if (map.getZoom() > 10) {
            // choosing to not zoom in from a lower number to make sure all points are visible
            map.setZoom(10);
          }
        }
        map.on('load', () => {
          map.loadImage(
            '/marker-blue.png'
          ).then(function(imageBlue) {
            map.addImage('marker-blue', imageBlue.data);
            map.loadImage(
              '/marker-red.png'
            ).then(function (imageRed) {
                map.addImage('marker-red', imageRed.data);

                map.addSource('places', {
                  type: 'geojson',
                  data: allFeatures
                });

                map.addLayer({
                  'id': 'poi-icons',
                  'type': 'symbol',
                  'source': 'places',
                  'layout': {
                    'icon-image': 'marker-red',
                    'icon-size': 0.5,
                    'icon-offset': [0, -26],
                    'text-offset': [0, 0.9],
                    'icon-allow-overlap': true,
                    'symbol-z-order': 'source',
                    'symbol-sort-key': [
                      'match',
                      ['get', 'divId'],
                      '', // initialize to not match anything
                      1000, // sort key when id is the hovered feature id
                      0 // default
                    ],
                  },
                  'paint': {
                  }
                });

                map.addLayer({
                  'id': 'poi-labels',
                  'type': 'symbol',
                  'source': 'places',
                  'layout': {
                    'text-field': scope ? ['get', 'label'] : [
                      'format',
                      ['get', 'startTime'],
                      {
                        'font-scale': 1.1,
                        'text-font': [
                          'literal',
                          ['Noto Sans Italic']
                        ]
                      },
                      '\n',
                      {},
                      ['get', 'description'],
                      {'font-scale': 0.8}
                    ],
                    'text-line-height': 0.9,
                    // wider than the default 10 ems on a map of several days, so each show's
                    // "Oct 28 6:30pm The Hails..." line stays one line
                    'text-max-width': scope ? 24 : 10,
                    'text-font': ['Noto Sans Regular'],
                    'text-justify': 'left',
                    'text-allow-overlap': true,
                    'text-size': 14,
                    'text-offset': [0, 0],
                    'text-anchor': 'top',
                  },
                  'paint': {
                      'text-color': '#333333',
                      'text-opacity': [
                        // increase from 0 at zoom 10 to 1 at zoom 12
                        'interpolate',
                        ['exponential', 0.5],
                        ['zoom'],
                        10,
                        0,
                        11,
                        1,
                      ]
                  }
                });
            });
          });
        });
        // a pin's shows, listed under the map, and the pin marked
        const showPin = (feature) => {
          document.getElementById(`map-${date}-info`).innerHTML = '';

          // Get all divs at this venue (or venues), on this date or (scope "all") any
          const venueIds = feature.properties.venueIds.split(',');
          const eventsQuerySelector = venueIds
            .map(venueId => scope
              ? `div.event[data-venue-id="${venueId}"]`
              : `div.event[data-date="${date}"][data-venue-id="${venueId}"]`)
            .join(', ');
          const eventDivs = Array.from(document.querySelectorAll(eventsQuerySelector)).filter(notACopy);
          eventDivs.forEach(eventDiv => {
            // clone the whole eventDiv and insert it into the map-<date>-info div.
            // the clone keeps the .event layout (time column + text column), so it
            // lines up exactly like the listing below -- don't restyle it here
            const clonedEventDiv = eventDiv.cloneNode(true);
            // a map of several days: say which day, above the time, as "Wed", "Oct 28" and the
            // time on lines of their own, each no wider than the time column, so the text
            // lines up with the listing's. real line breaks, not only css, so it holds
            // whatever stylesheet the browser has cached
            const time = scope && clonedEventDiv.querySelector('.event-time');
            if (time) {
              const day = document.createElement('span');
              day.className = 'event-date';
              const mmddyy = eventDiv.getAttribute('data-date');
              day.append(weekday(mmddyy), document.createElement('br'), shortDate(mmddyy));
              time.prepend(day, document.createElement('br'));
            }
            document.getElementById(`map-${date}-info`).appendChild(clonedEventDiv);
          })
          document.getElementById(`map-${date}-info`).style.display = 'block';

          if (!map.getLayer('poi-icons')) {
            return;  // the style hasn't loaded, so there are no pins to mark yet
          }
          map.setLayoutProperty('poi-icons', 'icon-image',
            [
              'match',
              ['get', 'divId'],
              feature.properties.divId,
              'marker-blue', //image when id is the hovered feature id
              'marker-red' // default
            ]
          );
          map.setLayoutProperty('poi-icons', 'symbol-sort-key',
            [
              'match',
              ['get', 'divId'],
              feature.properties.divId,
              1000, // sort key when id is the hovered feature id
              0 // default
            ]
          )
        };
        map.on('click', 'poi-icons', (e) => showPin(e.features[0]));
        window.siteMaps[date] = {map: map, features: allFeatures.features, showPin: showPin};
        map.on('mousemove', 'poi-icons', (e) => {
          if (e.features.length > 0) {
            // change cursor
            map.getCanvas().style.cursor = 'pointer';
          }
        });
        map.on('mouseleave', 'poi-icons', () => {
          // reset cursor
          map.getCanvas().style.cursor = '';
        });
      });
    });

    // IF we're on the index page, then actually CLICK the very first
    // SHOW MAP link..........!!!!!!!!!!!!!!!!!!!
    if (window.location.pathname === '/') {
      dateLinks[0].click();
    }
  });
</script>
