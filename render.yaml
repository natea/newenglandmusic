# render blueprint: the web site, its postgres database and the scheduled jobs.
# spec: https://render.com/docs/blueprint-spec
databases:
  - name: newenglandmusic
    databaseName: newenglandmusic
    # free: expires 30 days after creation and is deleted 14 days later, with no
    # backups. upgrade it to a paid plan in place (data kept) before then, or
    # restore a dump into a new one; see PRODUCTION.md
    plan: free
    # closest region to the venues (the northeast)
    region: virginia
    postgresMajorVersion: "17"

services:
  - type: web
    name: newenglandmusic
    runtime: python
    # 0.5c-512mb ($7/month): stays awake and has a shell tab. free sleeps after
    # 15 idle minutes and takes about a minute to wake
    plan: 0.5c-512mb
    region: virginia
    branch: main
    # deploy a commit only after github actions has run the tests on it
    autoDeployTrigger: checksPass
    # also runs the migrations, so a failed migration fails the build
    buildCommand: ./bin/build.sh
    startCommand: 'gunicorn --access-logformat ''%(h)s %(l)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s" reqtime: %(M)s ms'' nycnoise.wsgi:application'
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      # gunicorn workers; each takes ~100mb, so 2 fits in 512mb
      - key: WEB_CONCURRENCY
        value: 2
      - key: DJANGO_SETTINGS_MODULE
        value: nycnoise.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: newenglandmusic
          property: connectionString
      # your domain(s), comma-separated; leave blank to use only the onrender.com address
      - key: ALLOWED_HOSTS
        sync: false
      # https:// plus your domain, for share links; blank uses the onrender.com address
      - key: SITE_URL
        sync: false
      - key: PROTOMAPS_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GOATCOUNTER_CODE
        sync: false
      # a google cloud service account's json key, for the sheet sync (see PRODUCTION.md)
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # inherited from nyc noise and unused by this site, but the settings require them
      - key: PROD_INTERNAL_API_SERVER
        value: https://nyc-noise.com/
      - key: RC_DEVELOPER_INTERNAL_TOKEN
        value: unused
      - key: PYINSTRUMENT_ENABLE
        value: "false"
      - key: DEBUG_TOOLBAR_ENABLE
        value: "false"
      - key: ENABLE_EMAILING_JESSICA_ON_EVENT_SUBMISSION
        value: "False"

  # sheet sync, places lookups and event fetching, daily at 10:00 utc (5 or 6 am eastern)
  - type: cron
    name: newenglandmusic-daily
    runtime: python
    # billed by the second of running time, with a $1 minimum a month
    plan: 0.5c-512mb
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 10 * * *"
    # only installs requirements: the web service's build migrates
    buildCommand: ./bin/build-job.sh
    startCommand: ./bin/daily.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: DJANGO_SETTINGS_MODULE
        value: nycnoise.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: newenglandmusic
          property: connectionString
      # secrets are set once, on the web service, and copied here on each blueprint sync
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: DJANGO_SECRET_KEY
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: GOOGLE_SERVICE_ACCOUNT_JSON
      - key: GOOGLE_PLACES_API_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: GOOGLE_PLACES_API_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: ANTHROPIC_API_KEY
      - key: TICKETMASTER_API_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: TICKETMASTER_API_KEY
      - key: EVENTBRITE_API_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: EVENTBRITE_API_KEY
      # inherited from nyc noise and unused, but the settings require them
      - key: PROD_INTERNAL_API_SERVER
        value: https://nyc-noise.com/
      - key: RC_DEVELOPER_INTERNAL_TOKEN
        value: unused
      - key: PYINSTRUMENT_ENABLE
        value: "false"
      - key: DEBUG_TOOLBAR_ENABLE
        value: "false"
      - key: ENABLE_EMAILING_JESSICA_ON_EVENT_SUBMISSION
        value: "False"

  # event source check and api matching, sundays at 07:00 utc, before that day's daily run
  - type: cron
    name: newenglandmusic-weekly
    runtime: python
    # billed by the second of running time, with a $1 minimum a month
    plan: 0.5c-512mb
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 7 * * 0"
    # only installs requirements: the web service's build migrates
    buildCommand: ./bin/build-job.sh
    startCommand: ./bin/weekly.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: DJANGO_SETTINGS_MODULE
        value: nycnoise.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: newenglandmusic
          property: connectionString
      # secrets are set once, on the web service, and copied here on each blueprint sync
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: DJANGO_SECRET_KEY
      - key: TICKETMASTER_API_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: TICKETMASTER_API_KEY
      - key: EVENTBRITE_API_KEY
        fromService:
          type: web
          name: newenglandmusic
          envVarKey: EVENTBRITE_API_KEY
      # inherited from nyc noise and unused, but the settings require them
      - key: PROD_INTERNAL_API_SERVER
        value: https://nyc-noise.com/
      - key: RC_DEVELOPER_INTERNAL_TOKEN
        value: unused
      - key: PYINSTRUMENT_ENABLE
        value: "false"
      - key: DEBUG_TOOLBAR_ENABLE
        value: "false"
      - key: ENABLE_EMAILING_JESSICA_ON_EVENT_SUBMISSION
        value: "False"
