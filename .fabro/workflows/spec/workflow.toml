_version = 1

[workflow]
graph = "workflow.fabro"

# Started by the intentable bridge for an issue in spec-review on
# natea/newenglandmusic, in the server's daytona environment. The bridge passes
# all five inputs as text; the empty defaults only let a run started by hand be
# created.
[run.inputs]
issue_number = ""
issue_title = ""
issue_body = ""
issue_author = ""
issue_thread = ""

# The agents write a proposal in the sandbox; nothing is pushed and no pull
# request is opened. The bridge commits the draft from the artifacts.
[run.pull_request]
enabled = false

[run.run_branch]
push = false

# Only the last step writes these; .intentable/ is git-ignored.
[run.artifacts]
include = [".intentable/result.json", ".intentable/review.md", ".intentable/proposal/**"]
